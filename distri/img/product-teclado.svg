<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="250">
  <rect width="400" height="250" fill="#f1f5f9"/>
  <!-- Keyboard chassis -->
  <rect x="50" y="55" width="300" height="130" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="3"/>
  <!-- Key grid rows -->
  <g fill="#334155" rx="3">
    <!-- Row 1 -->
    <rect x="65" y="70" width="22" height="18" rx="3"/>
    <rect x="92" y="70" width="22" height="18" rx="3"/>
    <rect x="119" y="70" width="22" height="18" rx="3"/>
    <rect x="146" y="70" width="22" height="18" rx="3"/>
    <rect x="173" y="70" width="22" height="18" rx="3"/>
    <rect x="200" y="70" width="22" height="18" rx="3"/>
    <rect x="227" y="70" width="22" height="18" rx="3"/>
    <rect x="254" y="70" width="22" height="18" rx="3"/>
    <rect x="281" y="70" width="45" height="18" rx="3" fill="#f43f5e"/>
    <!-- Row 2 -->
    <rect x="65" y="95" width="30" height="18" rx="3"/>
    <rect x="100" y="95" width="22" height="18" rx="3"/>
    <rect x="127" y="95" width="22" height="18" rx="3"/>
    <rect x="154" y="95" width="22" height="18" rx="3"/>
    <rect x="181" y="95" width="22" height="18" rx="3"/>
    <rect x="208" y="95" width="22" height="18" rx="3"/>
    <rect x="235" y="95" width="22" height="18" rx="3"/>
    <rect x="262" y="95" width="64" height="18" rx="3" fill="#06b6d4"/>
    <!-- Spacebar row -->
    <rect x="65" y="125" width="40" height="20" rx="3"/>
    <rect x="120" y="125" width="150" height="20" rx="4" fill="#a855f7"/>
    <rect x="285" y="125" width="40" height="20" rx="3"/>
  </g>
  <text x="200" y="225" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Teclado Mecánico RGB</text>
</svg>

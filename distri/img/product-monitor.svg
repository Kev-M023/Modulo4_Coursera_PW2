<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="250">
  <rect width="400" height="250" fill="#f1f5f9"/>
  <!-- Monitor frame -->
  <rect x="60" y="25" width="280" height="160" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="3"/>
  <rect x="70" y="35" width="260" height="140" rx="4" fill="#1e1b4b"/>
  <!-- Chart lines on screen -->
  <path d="M90 140 Q 140 70 200 110 T 310 60" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="200" cy="110" r="5" fill="#38bdf8"/>
  <circle cx="310" cy="60" r="5" fill="#a855f7"/>
  <!-- Stand -->
  <rect x="185" y="185" width="30" height="35" fill="#475569"/>
  <rect x="140" y="215" width="120" height="10" rx="5" fill="#334155"/>
  <text x="200" y="242" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Monitor Curvo 27" 4K</text>
</svg>
